<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cheksiz.AI</title>
<style>
:root{--bg:#edf0f3;--panel:#fff;--ink:#16212b;--mute:#66737f;--line:#d5dbe1;--me:#1d4f91;--me-ink:#fff;--bot:#e3e8ee}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--panel:#18212a;--ink:#e6ebf0;--mute:#8d9aa6;--line:#2a3640;--me:#3d7bd0;--me-ink:#fff;--bot:#202c37}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;background:var(--panel);border-inline:1px solid var(--line)}
header{display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.02em}
header button{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;font-size:14px}
#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.tag{align-self:flex-start;color:var(--mute);font-size:13px;margin-top:-8px}
.err{color:#c0392b}
.empty{margin:auto;color:var(--mute);text-align:center;max-width:32ch}
form{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;max-height:140px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
form button{padding:0 20px;border:0;border-radius:10px;background:var(--me);color:var(--me-ink);font:inherit;font-weight:600;cursor:pointer}
form button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--me);outline-offset:2px}
</style>
</head>
<body>
<main>
  <header><h1>cheksiz.AI</h1><button id="reset">Yangi suhbat</button></header>
  <div id="log"></div>
  <form id="f">
    <textarea id="q" rows="1" placeholder="Savolingizni yozing" autofocus></textarea>
    <button id="send">Yuborish</button>
  </form>
</main>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),send=document.getElementById('send');
let history=[];
try{history=JSON.parse(localStorage.getItem('hist')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('hist',JSON.stringify(history))}catch(e){}};
function add(cls,text){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function tag(t){const d=document.createElement('div');d.className='tag';d.textContent=t;log.appendChild(d)}
function render(){log.innerHTML='';if(!history.length){const e=document.createElement('div');e.className='empty';e.textContent='Savol bering. Bir provayderning limiti tugasa, suhbat keyingisida davom etadi.';log.appendChild(e)}
  history.forEach(m=>{add(m.role==='user'?'me':'bot',m.content);if(m.via)tag(m.via)})}
function password(){let p=localStorage.getItem('pw');if(!p){p=prompt('Parolni kiriting');if(p)localStorage.setItem('pw',p)}return p||''}
async function ask(text){
  history.push({role:'user',content:text});save();render();
  const wait=add('bot','…');send.disabled=true;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-Password':password()},
      body:JSON.stringify({messages:history.map(({role,content})=>({role,content}))})});
    const j=await r.json();
    if(r.status===401){localStorage.removeItem('pw')}
    if(!r.ok)throw new Error(j.error||'Xato');
    history.push({role:'assistant',content:j.reply,via:j.provider+' · '+j.model});
  }catch(e){
    history.pop();wait.remove();render();
    const d=add('bot err',e.message);send.disabled=false;return;
  }
  save();render();send.disabled=false;q.focus();
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const t=q.value.trim();if(!t||send.disabled)return;q.value='';ask(t)});
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('f').requestSubmit()}});
document.getElementById('reset').onclick=()=>{history=[];save();render()};
render();
</script>
</body>
</html>
